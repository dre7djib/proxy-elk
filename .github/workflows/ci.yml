name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect a Go module
        id: gomod
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-go@v5
        if: steps.gomod.outputs.present == 'true'
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: steps.gomod.outputs.present == 'true'
        run: test -z "$(gofmt -l .)"

      - name: Static analysis
        if: steps.gomod.outputs.present == 'true'
        run: go vet ./...

      - name: Tests
        if: steps.gomod.outputs.present == 'true'
        run: go test ./...

      - name: Static release binaries
        if: steps.gomod.outputs.present == 'true'
        run: |
          VERSION=ci-${GITHUB_SHA::7} make release
          file dist/proxy-linux-amd64 dist/proxy-linux-arm64
          (cd dist && sha256sum -c SHA256SUMS)
          ./dist/proxy-linux-amd64 -version

      - name: No Go module yet
        if: steps.gomod.outputs.present == 'false'
        run: echo "No go.mod, nothing to build for now."
