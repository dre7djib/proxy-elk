# Secrets are references, never literal values.
#   ${env:NAME}     environment variable
#   ${file:/path}   file contents (mounted secret)
# Quote references: YAML treats an unquoted {...} as a flow mapping.

listen: ":8080"
elasticsearch:
  url: https://elasticsearch:9200
  # api_key is only for the ACL index resolver's own calls
  # (/_resolve/index); it is never sent on the relayed request.
  api_key: "${env:ES_API_KEY}"
  # run_as_user/run_as_password: the service account the relay
  # authenticates as upstream; es-security-runas-user then impersonates
  # the caller once ACL allows the request.
  run_as_user: proxy_service
  run_as_password: "${env:ES_RUN_AS_PASSWORD}"
  # shadow_password: native-realm secret substituted into
  # POST /_security/profile/_activate for an LDAP user, once their LDAP
  # password has been re-checked. Never typed by a user, never sent to LDAP.
  shadow_password: "${env:ES_SHADOW_PASSWORD}"
  # passthrough_users relay unchanged, with their own Basic credentials,
  # never through the ACL. Default shown.
  # passthrough_users: [kibana_system]

# Omit the oidc section entirely to disable OIDC login.
oidc:
  issuer: https://keycloak.example/realms/proxy
  client_id: proxy
  client_secret: "${env:OIDC_CLIENT_SECRET}"
  redirect_url: https://proxy.example/callback
  scopes: [openid, email, profile, groups]
  groups_claim: groups

# Omit the ldap section entirely to disable LDAP login.
ldap:
  url: ldaps://ldap.example:636
  # Plaintext ldap:// requires start_tls: true, or insecure_allow_plaintext
  # (dev only) to start without either.
  # url: ldap://ldap.example:389
  # start_tls: true
  bind_dn: "cn=readonly,dc=example,dc=org"
  bind_password: "${env:LDAP_BIND_PASSWORD}"
  base_dn: "ou=people,dc=example,dc=org"
  user_filter: "(uid=%s)"
  # Active Directory: user_filter: "(sAMAccountName=%s)"
  groups_base_dn: "ou=groups,dc=example,dc=org"
  ca_file: /etc/proxy/ldap-ca.pem
  # insecure_allow_plaintext: true   # dev only

  # Failover: an ordered list of directory addresses, tried in order on a
  # connection or StartTLS failure. Mutually exclusive with url above.
  # urls: [ldaps://dc1.example:636, ldaps://dc2.example:636]

  # Active Directory nested group membership (LDAP_MATCHING_RULE_IN_CHAIN).
  # false (default) does a flat groupOfNames/member search.
  nested_groups: true
  group_cache_ttl: 5m  # default

  # Lockout a (user, IP) pair after max_failures failed logins within
  # failure_window, for lockout_for. Defaults shown.
  max_failures: 5
  failure_window: 15m
  lockout_for: 15m

# Machine-to-machine access: the proxy verifies a Bearer JWT an
# external IdP already issued; it never mints one. Omit the jwt section
# entirely to disable it. No session cookie is involved for these callers.
jwt:
  issuer: https://idp.example/realms/demo
  audience: proxy-m2m
  jwks_url: https://idp.example/realms/demo/protocol/openid-connect/certs
  # groups_claim: groups

# Teams: each one yields a read rule team:<name> for the union of its
# groups; viewer/editor/admin differ only in Kibana, not in index access.
teams:
  - name: equipe-a
    space: equipe-a
    indices: [equipe-a-*]
    levels:
      viewer: [equipe-a-viewer]
      editor: [equipe-a-editor]
      admin: [equipe-a-admin]

# Declarative, read-only access policy: allow rules only,
# fail-closed. Required — the proxy refuses to start without at least one
# rule. A rule matches a caller if their subject is in users, or any of
# their groups intersects groups; indices are glob patterns (path.Match)
# resolved against concrete index names (aliases are resolved first).
# Classify turns an upstream request's method+path into read, write
# or cluster_admin; a rule can only ever grant read (actions: [write] or
# [cluster_admin] fails to load) — the index being covered never grants a
# write or a cluster_admin request.
acl:
  # known_groups: [equipe-a-viewer, equipe-a-editor]  # optional: unknown
  # group referenced by a rule fails to load
  # system_indices: [.kibana*, .security*, .tasks*, .enrich-*]  # default shown
  rules:
    - name: shared-ref-read
      groups: [equipe-a-viewer, equipe-a-editor]
      indices: [shared-ref]
      actions: [read]
    - name: alice-extra
      users: [alice]
      indices: [alice-scratch]
      actions: [read]

      # Optional conditions, all absent here so this rule behaves
      # exactly as above. Every condition set on a rule must match; a
      # condition a rule doesn't set never restricts it.
      # source_ips: ["10.0.0.0/8"]   # IP or CIDR, matched against RemoteAddr
      #                              # only — never X-Forwarded-For
      # methods: [GET, POST]
      # time:
      #   from: "08:00"              # UTC, HH:MM
      #   to: "18:00"
      #   days: [Mon, Tue, Wed, Thu, Fri]   # omit for every day

# Per-role quotas: omit the whole section for no plafond at all
# (today's behavior). Each roles entry's groups must be disjoint from
# every other entry's; a caller matching several entries gets the minimum
# of each plafond. A caller matching no entry gets default, or no plafond
# if default is unset too. Enforced only on the catch-all handler, not on
# /health, /metrics or /auth/*.
limits:
  default:
    max_duration: 30s
    max_result_bytes: 10485760   # 10 MiB
    requests_per_minute: 120
  roles:
    - groups: [equipe-a-viewer, equipe-b-viewer]
      max_duration: 15s
      max_result_bytes: 1048576
      requests_per_minute: 30

# Required as soon as oidc or ldap is active: the login session (shared by
# both) is an HMAC-signed cookie, not a server-side store.
session:
  secret: "${env:SESSION_SECRET}"   # at least 32 bytes
  ttl: 8h  # default

# Optional Kibana SSO bridge: adds GET/POST /auth/kibana (a login form of
# its own), which logs the browser into Kibana's own session on its
# behalf after an LDAP login, so Kibana's login screen never appears.
# Requires ldap: above. url is the address the proxy itself calls
# (container-internal); public_url is where the browser is redirected
# afterwards and defaults to url when omitted.
# kibana:
#   url: http://kibana:5601
#   public_url: http://127.0.0.1:5601
#   # `proxy -sync` writes one Kibana space per team and one role per level
#   # (read + view_index_metadata on the team's indices, never more) via
#   # /api/spaces/space and /api/security/role. It compares first: a second
#   # run writes nothing, a hand-edited role is logged to the audit then
#   # reset. `proxy -sync -dry-run` prints the differences, writes nothing.
#   # Needs url, sync_user and sync_password (a secret reference).
#   sync_user: elastic
#   sync_password: "${env:KIBANA_SYNC_PASSWORD}"

# Optional SPNEGO/Kerberos login, on top of LDAP/OIDC: when set, GET
# /auth/kibana stops rendering the form and becomes the Negotiate
# challenge/response instead — the browser's own Kerberos authentication signs
# it into Kibana with zero fields typed. Requires ldap: above (groups)
# and session: below, same as OIDC/LDAP. keytab_file is a mounted binary
# file, never a ${file:} secret reference. The proxy never contacts the
# KDC itself: accepting a client's SPNEGO token only needs the keytab, so no
# krb5.conf is required in its container.
# kerberos:
#   keytab_file: /etc/proxy/krb5.keytab
#   service_principal: HTTP/proxy.demo.local@EXAMPLE.ORG
#   realm: EXAMPLE.ORG

# Optional short identity JWT (RS256) the proxy signs for Kibana: Kibana
# calls POST /_proxy/identity-token; public keys at GET /identity/jwks.
# ttl 5m–15m (default 10m). One or two PEM private keys: the first signs,
# both verify. Rotate: add the new key first, drop the old one after ttl.
# identity_token:
#   issuer: proxy
#   audience: engine
#   ttl: 10m
#   keys:
#     - kid: current
#       private_key: "${file:/etc/proxy/idtoken-current.pem}"
#     - kid: previous
#       private_key: "${file:/etc/proxy/idtoken-previous.pem}"

# Optional assistant model behind POST /_proxy/ask (any chat-completions
# API). Absent: the route answers 503.
# model:
#   url: https://api.openai.com/v1/chat/completions
#   api_key: "${env:MODEL_API_KEY}"
#   name: gpt-4o-mini
