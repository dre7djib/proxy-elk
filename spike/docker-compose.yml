name: spike-proxy-elk

# Stack jetable du spike SP-01 à SP-04 : Elasticsearch + Kibana 8.19 avec
# sécurité activée, un OpenLDAP peuplé d'utilisateurs de test, et un proxy Go
# qui journalise tous les appels (SP-02) et valide le login LDAP via
# search-then-bind puis run_as (SP-03, piste A). Login natif "elastic"
# toujours possible en repli (SP-01). Depuis SP-04, un rôle ES et un space
# Kibana par équipe (equipe-a, equipe-b) isolent alice/bob/carol les uns des
# autres (service kibana-setup, scripts/kibana-bootstrap.sh).
# Pas de TLS entre les services, LDAP en clair : simplifie le spike, accepté
# pour un spike jetable (voir spike/README.md, F5/F68 pour la suite).

services:
  # Prépare Elasticsearch une fois qu'il répond, puis s'arrête (pattern
  # officiel Elastic) : mot de passe de kibana_system (SP-01), et depuis
  # SP-03 le rôle + l'utilisateur de service pour le run_as, ainsi que les
  # utilisateurs natifs alice/bob/carol (requis pour que run_as fonctionne,
  # voir spike/scripts/es-bootstrap.sh).
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - PROXY_SERVICE_PASSWORD=${PROXY_SERVICE_PASSWORD}
      - NATIVE_SHADOW_PASSWORD=${NATIVE_SHADOW_PASSWORD}
    volumes:
      - ./scripts/es-bootstrap.sh:/usr/local/bin/es-bootstrap.sh:ro
    networks:
      - spike
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["bash", "/usr/local/bin/es-bootstrap.sh"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    environment:
      - node.name=es01
      - cluster.name=spike-proxy-elk
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.license.self_generated.type=basic
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - spike
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  # Proxy du spike SP-02/SP-03, entre Kibana et Elasticsearch : journalise
  # chaque appel en JSON sur stdout (SP-02) et, depuis SP-03, valide les
  # logins LDAP (search-then-bind) puis parle à Elasticsearch avec le compte
  # de service proxy_service en usurpant l'identité (run_as, piste A). Voir
  # spike/proxy/main.go. ACL/J1 toujours hors périmètre (F66, F67).
  proxy:
    build: ./proxy
    environment:
      - UPSTREAM_URL=http://elasticsearch:9200
      - LISTEN_ADDR=:9200
      # SP-03 : search-then-bind (F4) contre OpenLDAP, puis run_as avec le
      # compte de service. Le DN et le mot de passe de lecture sont ceux
      # créés par LDAP_READONLY_USER sur le service openldap ci-dessous.
      - LDAP_URL=ldap://openldap:389
      - LDAP_READONLY_DN=cn=readonly,dc=example,dc=org
      - LDAP_READONLY_PASSWORD=${LDAP_READONLY_PASSWORD}
      - LDAP_BASE_DN=ou=people,dc=example,dc=org
      # Cache court de l'authentification LDAP : SP-02 a mesuré ~145
      # _authenticate et ~148 _has_privileges par cycle connexion + Discover,
      # un bind LDAP à chacun rendrait l'UI perceptiblement plus lente.
      - LDAP_CACHE_TTL=2m
      - PROXY_SERVICE_USER=proxy_service
      - PROXY_SERVICE_PASSWORD=${PROXY_SERVICE_PASSWORD}
      # Constat d'exécution SP-03 : requis pour POST
      # /_security/profile/_activate (voir proxy/main.go,
      # profileActivateMiddleware, et scripts/es-bootstrap.sh).
      - NATIVE_SHADOW_PASSWORD=${NATIVE_SHADOW_PASSWORD}
    depends_on:
      elasticsearch:
        condition: service_healthy
      openldap:
        condition: service_healthy
    ports:
      - "127.0.0.1:9210:9200"
    networks:
      - spike
    healthcheck:
      # Même test que pour Elasticsearch : s'il passe à travers le proxy,
      # c'est la preuve que le passe-plat est bien transparent au niveau HTTP.
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  # Prépare Kibana une fois qu'il répond (SP-04) : spaces equipe-a/equipe-b,
  # rôles equipe_a_viewer/equipe_a_editor/equipe_b_viewer complétés avec leurs
  # privilèges Kibana (base read/all, spaces) et leurs index, données et
  # dashboard de test. Service distinct de `setup` : celui-ci se termine
  # avant que Kibana existe, donc les privilèges Kibana ne peuvent être posés
  # qu'une fois Kibana démarré (voir scripts/kibana-bootstrap.sh).
  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./scripts/kibana-bootstrap.sh:/usr/local/bin/kibana-bootstrap.sh:ro
    networks:
      - spike
    depends_on:
      kibana:
        condition: service_healthy
    command: ["bash", "/usr/local/bin/kibana-bootstrap.sh"]

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    environment:
      - SERVERNAME=kibana
      # SP-02 : Kibana ne parle plus directement à Elasticsearch, il passe
      # par le proxy. Le compte kibana_system s'authentifie normalement,
      # le proxy relaie l'en-tête Authorization sans le modifier.
      - ELASTICSEARCH_HOSTS=http://proxy:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    volumes:
      - kibanadata:/usr/share/kibana/data
    networks:
      - spike
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '^(200|302)$'",
        ]
      interval: 10s
      timeout: 10s
      retries: 30

  # OpenLDAP peuplé d'utilisateurs de test (alice, bob, carol) via le LDIF de
  # ldap/01-bootstrap.ldif. Branché à Kibana depuis SP-03, via le search-then-
  # bind du proxy (spike/proxy/main.go) : OpenLDAP ne parle jamais directement
  # à Kibana ni à Elasticsearch.
  #
  # Image : osixia/openldap, pas bitnami/openldap. bitnami a retiré ses images
  # gratuites de Docker Hub en 2025 (docker.io/bitnami/openldap:2.6 introuvable
  # au moment du spike) ; osixia/openldap reste tirable et largement utilisé,
  # bien que le projet soit en maintenance réduite (constat journalisé dans le
  # plan du spike).
  openldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      - LDAP_ORGANISATION=Spike Proxy ELK
      - LDAP_DOMAIN=example.org
      - LDAP_BASE_DN=dc=example,dc=org
      - LDAP_ADMIN_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_CONFIG_PASSWORD=${LDAP_ADMIN_PASSWORD}
      - LDAP_TLS=false
      # Compte de lecture pour le search-then-bind du proxy (F4, SP-03).
      # L'image lui ajoute une ACL de lecture sur tout l'arbre ; un compte
      # créé à la main dans le LDIF custom n'aurait pas ce droit par défaut.
      - LDAP_READONLY_USER=true
      - LDAP_READONLY_USER_USERNAME=readonly
      - LDAP_READONLY_USER_PASSWORD=${LDAP_READONLY_PASSWORD}
      - LDAP_REMOVE_CONFIG_AFTER_SETUP=true
    ports:
      - "127.0.0.1:1389:389"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - ldapdata:/var/lib/ldap
      - ldapconfig:/etc/ldap/slapd.d
    networks:
      - spike
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapwhoami -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=org' -w \"$$LDAP_ADMIN_PASSWORD\" >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

networks:
  spike:
    driver: bridge

volumes:
  esdata:
  kibanadata:
  ldapdata:
  ldapconfig:
