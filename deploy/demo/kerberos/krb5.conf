# Demo-only krb5.conf: realm EXAMPLE.ORG, KDC at this container's own
# hostname (kdc, on the `demo` network). Used by kadmin.local inside
# this container to build the realm and the proxy's keytab; the proxy
# and Kibana containers never need this file (see plan: accepting a
# ticket via keytab doesn't contact the KDC).
[libdefaults]
    default_realm = EXAMPLE.ORG
    dns_lookup_kdc = false
    dns_lookup_realm = false
    # Without this, the client GSS library canonicalizes "proxy" via
    # reverse DNS first — Docker's embedded DNS resolves that to
    # something like proxy.<network>, whose domain then maps to a
    # realm that doesn't exist. Confirmed by testing: curl --negotiate
    # failed with "Server krbtgt/PROXY-ELK-DEMO_DEMO@EXAMPLE.ORG not
    # found" until this was set.
    rdns = false

[realms]
    EXAMPLE.ORG = {
        kdc = kdc
        admin_server = kdc
    }

[domain_realm]
    .example.org = EXAMPLE.ORG
    example.org = EXAMPLE.ORG
    .demo.local = EXAMPLE.ORG
    proxy.demo.local = EXAMPLE.ORG
    proxy = EXAMPLE.ORG
