# Config du proxy PRODUIT pour la démo J1-13/J1-15 (dérivée de
# configs/proxy.example.yaml). Expose /health, /metrics, /auth/* (OIDC +
# LDAP) et, depuis J1-15 (F2), le relais Elasticsearch (run_as,
# _activate) : seul chemin Kibana -> Elasticsearch de cette démo.

listen: ":8080"

elasticsearch:
  url: http://elasticsearch:9200
  # api_key: ES-generated by es-bootstrap.sh (view_index_metadata, used by
  # the ACL index resolver, F15), written to a volume shared with `setup`
  # — never a static .env value, so ${file:} rather than ${env:}.
  api_key: "${file:/secrets/es-api-key}"
  # run_as_user/run_as_password : compte de service créé par
  # es-bootstrap.sh (rôle proxy_runas, run_as alice/bob/carol).
  run_as_user: proxy_service
  run_as_password: "${env:ES_RUN_AS_PASSWORD}"
  # shadow_password : mot de passe natif partagé alice/bob/carol côté ES
  # (es-bootstrap.sh), substitué dans /_security/profile/_activate.
  shadow_password: "${env:ES_SHADOW_PASSWORD}"
  # elastic also passthrough: the demo's one-shot bootstrap scripts
  # (spike/scripts/kibana-bootstrap.sh, scripts/seed.sh) call Kibana's
  # own API with the elastic superuser, and Kibana's ES client for that
  # auth check now goes through this proxy too (ES has no host port).
  # Demo-only; out of ACL scope like kibana_system (J1-12/F67).
  passthrough_users: [kibana_system, elastic]

oidc:
  issuer: http://keycloak:18080/realms/demo
  client_id: proxy
  client_secret: "${env:OIDC_CLIENT_SECRET}"
  redirect_url: http://127.0.0.1:8081/auth/callback
  scopes: [openid, email, profile, groups]
  groups_claim: groups

ldap:
  # TLS démo (F5) : LDAPS vers le port 636 d'OpenLDAP, CA générée par
  # scripts/gen-certs.sh et montée en lecture seule (voir docker-compose.yml).
  url: ldaps://openldap:636
  bind_dn: "cn=readonly,dc=example,dc=org"
  bind_password: "${env:LDAP_READONLY_PASSWORD}"
  base_dn: "ou=people,dc=example,dc=org"
  user_filter: "(uid=%s)"
  groups_base_dn: "ou=groups,dc=example,dc=org"
  ca_file: /etc/proxy/certs/ca.crt
  nested_groups: false
  group_cache_ttl: 2m

# Groupes = mêmes CN que le LDIF spike (spike/ldap/01-bootstrap.ldif) et le
# realm Keycloak (keycloak/realm-export.json) : une seule ACL pour les deux
# fournisseurs d'identité de la démo.
acl:
  rules:
    - name: equipe-a-read
      groups: [equipe-a-viewer, equipe-a-editor]
      indices: [equipe-a-*]
      actions: [read]
    - name: equipe-b-read
      groups: [equipe-b-viewer]
      indices: [equipe-b-*]
      actions: [read]

# Limites par rôle (F25) : groupes viewer plus serrés que les groupes
# editor, pour la démo.
limits:
  default:
    max_duration: 30s
    max_result_bytes: 10485760   # 10 MiB
    requests_per_minute: 1200   # Kibana: des dizaines d'appels ES par page
  roles:
    - groups: [equipe-a-viewer, equipe-b-viewer]
      max_duration: 15s
      max_result_bytes: 10485760
      requests_per_minute: 600   # une page Kibana = des dizaines d'appels ES

session:
  secret: "${env:SESSION_SECRET}"
  ttl: 8h

# SSO bridge (/auth/kibana) : avec kerberos: ci-dessous actif, GET
# /auth/kibana devient le challenge SPNEGO/Negotiate (aucun formulaire) ;
# le proxy se logue lui-même sur Kibana (POST /internal/security/login)
# et relaie le cookie de session.
kibana:
  url: http://kibana:5601
  public_url: http://127.0.0.1:5601

# SSO Kerberos/SPNEGO (plan kerberos_spnego_sso) : keytab généré par le
# service `kdc` (deploy/demo/kerberos/entrypoint.sh), monté en lecture
# seule. HTTP/proxy.demo.local est le SPN que demande le navigateur
# (127.0.0.1 proxy.demo.local dans /etc/hosts, cf. README) ; le keytab
# contient aussi HTTP/proxy pour le client krb5-user du smoke-test
# (verify.sh), qui résout "proxy" sur le réseau Docker.
kerberos:
  keytab_file: /etc/proxy/krb5/krb5.keytab
  service_principal: HTTP/proxy.demo.local@EXAMPLE.ORG
  realm: EXAMPLE.ORG
