# Product proxy config for the demo (derived from
# configs/proxy.example.yaml). Exposes /health, /metrics, /auth/* (OIDC +
# LDAP) and the Elasticsearch relay (run_as,
# _activate): the only Kibana -> Elasticsearch path in this demo.

listen: ":8080"

elasticsearch:
  url: http://elasticsearch:9200
  # api_key: ES-generated by es-bootstrap.sh (view_index_metadata, used by
  # the ACL index resolver,), written to a volume shared with `setup`
  # — never a static .env value, so ${file:} rather than ${env:}.
  api_key: "${file:/secrets/es-api-key}"
  # run_as_user/run_as_password: service account created by
  # es-bootstrap.sh (role proxy_runas, run_as alice/bob/carol).
  run_as_user: proxy_service
  run_as_password: "${env:ES_RUN_AS_PASSWORD}"
  # shadow_password: shared native password for alice/bob/carol on the ES side
  # (es-bootstrap.sh), substituted into /_security/profile/_activate.
  shadow_password: "${env:ES_SHADOW_PASSWORD}"
  # elastic also passthrough: the demo's one-shot bootstrap scripts
  # (spike/scripts/kibana-bootstrap.sh, scripts/seed.sh) call Kibana's
  # own API with the elastic superuser, and Kibana's ES client for that
  # auth check now goes through this proxy too (ES has no host port).
  # Demo-only; out of ACL scope like kibana_system.
  passthrough_users: [kibana_system, elastic]

oidc:
  issuer: http://keycloak:18080/realms/demo
  client_id: proxy
  client_secret: "${env:OIDC_CLIENT_SECRET}"
  redirect_url: http://127.0.0.1:8081/auth/callback
  # groups is a client protocol mapper on the demo realm, not a Keycloak
  # scope. Requesting it makes the authorization endpoint reject the
  # request (invalid_scope) before the login form.
  scopes: [openid, email, profile]
  groups_claim: groups

ldap:
  # Demo TLS: LDAPS to OpenLDAP port 636, CA generated by
  # scripts/gen-certs.sh and mounted read-only (see docker-compose.yml).
  url: ldaps://openldap:636
  bind_dn: "cn=readonly,dc=example,dc=org"
  bind_password: "${env:LDAP_READONLY_PASSWORD}"
  base_dn: "ou=people,dc=example,dc=org"
  user_filter: "(uid=%s)"
  groups_base_dn: "ou=groups,dc=example,dc=org"
  ca_file: /etc/proxy/certs/ca.crt
  nested_groups: false
  group_cache_ttl: 2m

# Groups = the same CNs as the spike LDIF (spike/ldap/01-bootstrap.ldif) and the
# Keycloak realm (keycloak/realm-export.json): one ACL for both
# identity providers in this demo.
acl:
  rules:
    - name: equipe-a-read
      groups: [equipe-a-viewer, equipe-a-editor]
      indices: [equipe-a-*]
      actions: [read]
    - name: equipe-b-read
      groups: [equipe-b-viewer]
      indices: [equipe-b-*]
      actions: [read]

# Per-role limits: viewer groups are tighter than editor
# groups, for the demo.
limits:
  default:
    max_duration: 30s
    max_result_bytes: 10485760   # 10 MiB
    requests_per_minute: 1200   # Kibana: dozens of ES calls per page
  roles:
    - groups: [equipe-a-viewer, equipe-b-viewer]
      max_duration: 15s
      max_result_bytes: 10485760
      requests_per_minute: 600   # one Kibana page = dozens of ES calls

session:
  secret: "${env:SESSION_SECRET}"
  ttl: 8h

# SSO bridge (/auth/kibana): with kerberos: below enabled, GET
# /auth/kibana becomes the SPNEGO/Negotiate challenge (no form);
# the proxy logs into Kibana itself (POST /internal/security/login)
# and forwards the session cookie.
kibana:
  url: http://kibana:5601
  public_url: http://127.0.0.1:5601

# Kerberos/SPNEGO SSO (plan kerberos_spnego_sso): keytab generated by the
# `kdc` service (deploy/demo/kerberos/entrypoint.sh), mounted
# read-only. HTTP/proxy.demo.local is the SPN the browser requests
# (127.0.0.1 proxy.demo.local in /etc/hosts, see the README); the keytab
# also contains HTTP/proxy for the krb5-user smoke-test client
# (verify.sh), which resolves "proxy" on the Docker network.
kerberos:
  keytab_file: /etc/proxy/krb5/krb5.keytab
  service_principal: HTTP/proxy.demo.local@EXAMPLE.ORG
  realm: EXAMPLE.ORG
